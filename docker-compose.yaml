services:
  web:
    build: .
    ports:
      - '3100:3000'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app-data:/app/data
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6389:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10
volumes:
  app-data:
  redis-data:
