name: Coolify 4.7.5 isolated Compose lifecycle contract
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: compose-contract
  cancel-in-progress: false
jobs:
  contract:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check evidence assertions and fault injection
        run: python3 -m unittest discover -s bench -p 'test_*.py' -v
      - name: Bootstrap disposable Coolify
        run: python3 bench/bootstrap.py
      - name: Native provider contract
        run: python3 bench/contract.py
      - name: Collect sanitized evidence
        if: always()
        run: python3 bench/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-contract-evidence
          path: evidence/
          retention-days: 7
